<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MeshSense</title>
    <style>
      :root {
        --color-slate-600: oklch(44.6% .043 257.281);
        --color-blue-950: oklch(28.2% .091 267.935);
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body, html {
        height: 100%;
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        color: white;
        background: linear-gradient(to bottom right, var(--color-slate-600), var(--color-blue-950));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .loading-text {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="loading-text">MeshSense Loading...</div>
  </body>
</html>
